<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Up Life</title><style>body{font-family:system-ui;margin:0;background:#0d1117;color:#eef2f7}main{max-width:1100px;margin:auto;padding:24px}.card{background:#151b24;border:1px solid #2b3746;border-radius:16px;padding:18px;margin-bottom:16px}img{max-width:100%;border-radius:14px;display:block;margin:auto;max-height:520px;object-fit:cover}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}button{padding:12px;border:1px solid #314152;border-radius:10px;background:#1b2430;color:white;cursor:pointer;font-weight:700;margin:4px}.bar{height:10px;background:#0b1016;border-radius:10px;overflow:hidden}.fill{height:100%;background:#72e0a6;width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:10px;background:#111720;border-radius:10px}.muted{color:#9aa7b8}h1{margin-top:0}</style></head><body><main><div class="card"><h1>Level Up — Life Game</h1><p class="muted">A personal progression game for study + health.</p></div><div class="grid"><div class="card"><h2>Your Avatar · Age 21</h2><img src="avatar.jpg" alt="Player avatar"></div><div class="card"><h2 id="lvl">Level 1</h2><div class="bar"><div class="fill" id="xpbar"></div></div><p id="xptext">0 / 100 XP</p><div class="stats"><div class="stat"><b>Study</b><div id="study">0</div></div><div class="stat"><b>Health</b><div id="health">0</div></div><div class="stat"><b>Discipline</b><div id="discipline">50</div></div><div class="stat"><b>Energy</b><div id="energy">70</div></div><div class="stat"><b>Focus</b><div id="focus">60</div></div><div class="stat"><b>Fitness</b><div id="fitness">50</div></div></div></div></div><div class="card"><h2>Actions</h2><button onclick="act(30,'study',8,-12)">📚 Deep Study +30 XP</button><button onclick="act(12,'study',4,-5)">🧠 Revision +12 XP</button><button onclick="act(25,'health',0,-18)">🏃 Workout +25 XP</button><button onclick="act(10,'health',4,-6)">🚶 Walk +10 XP</button><button onclick="sleep()">😴 Sleep</button><button onclick="plan()">🗓️ Plan Tomorrow</button><p class="muted">This is the first GitHub version. We will replace these placeholder rules with your real parameters.</p></div></main><script>let s=JSON.parse(localStorage.getItem('lvlgame')||'null')||{level:1,xp:0,study:0,health:0,discipline:50,energy:70,focus:60,fitness:50};function save(){localStorage.setItem('lvlgame',JSON.stringify(s))}function need(){return 100+(s.level-1)*35}function render(){document.getElementById('lvl').textContent='Level '+s.level;document.getElementById('xpbar').style.width=(s.xp/need()*100)+'%';document.getElementById('xptext').textContent=s.xp+' / '+need()+' XP';for(const k of ['study','health','discipline','energy','focus','fitness'])document.getElementById(k).textContent=Math.round(s[k]);save()}function level(){while(s.xp>=need()){s.xp-=need();s.level++;s.discipline=Math.min(100,s.discipline+5);s.energy=Math.min(100,s.energy+5)}}function act(xp,type,focusGain,cost){if(s.energy<cost){alert('Too tired. Recover first.');return}s.energy-=cost;if(type==='study'){s.study+=xp;s.focus=Math.min(100,s.focus+focusGain)}else{s.health+=xp;s.fitness=Math.min(100,s.fitness+8)}s.xp+=xp;s.discipline=Math.min(100,s.discipline+1);level();render()}function sleep(){s.energy=Math.min(100,s.energy+20);s.focus=Math.min(100,s.focus+8);s.fitness=Math.min(100,s.fitness+2);render()}function plan(){s.discipline=Math.min(100,s.discipline+7);s.focus=Math.min(100,s.focus+5);render()}render()</script></body></html>
